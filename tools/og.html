<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; width: 1200px; height: 630px; background: #15191f; color: #f6f3ec; font-family: Inter, sans-serif; }
  .wrap { padding: 64px 72px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
  .top { font-size: 26px; font-weight: 600; color: #a2a9b3; letter-spacing: 0.04em; }
  .words { font: 800 112px/1 Fraunces, serif; letter-spacing: -2px; }
  .words .k { color: #e0b84a; } .words .l { color: #e07a4c; } .words .s { color: #4cc283; }
  .words .dot { color: #4b525c; }
  .sub { font-size: 30px; color: #d9d4c9; margin-top: 18px; }
  .name { display: flex; justify-content: space-between; align-items: flex-end; }
  .name b { font: 700 44px Fraunces, serif; }
  .name span { font-size: 24px; color: #a2a9b3; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">FULL-STACK DEVELOPER · KENYA</div>
    <div>
      <div class="words"><span class="k">Kopa</span><span class="dot">.</span> <span class="l">Linda</span><span class="dot">.</span> <span class="s">Soma</span><span class="dot">.</span></div>
      <div class="sub">Three systems, three Swahili words, built for how Kenya actually works.</div>
    </div>
    <div class="name"><b>Stanley Murangiri</b><span>KopaAlert · LindaMeru · SomaOrbit</span></div>
  </div>
</body>
</html>
